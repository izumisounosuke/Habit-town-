<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>習慣の町</title>
<meta name="description" content="毎日の記録と月の大目標で町が育つ習慣トラッカー">
<meta name="theme-color" content="#F1F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣の町">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  --ink:#1C2A33; --mid:#66757E; --faint:rgba(28,42,51,.14);
  --green:#A6E86D; --green-bg:#E4F5D2; --green-line:#8FCB57; --yellow:#FBF06B; --blue:#8FD9F2;
  min-height:100vh; color:var(--ink);
  font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic UI',system-ui,sans-serif;
  background-color:#F1F4EF;
  background-image:linear-gradient(rgba(28,42,51,.065) 1px,transparent 1px),
    linear-gradient(90deg,rgba(28,42,51,.065) 1px,transparent 1px);
  background-size:22px 22px;
  padding:calc(18px + env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:620px;margin:0 auto;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,'Roboto Mono',monospace;font-variant-numeric:tabular-nums;}
.card{background:rgba(255,255,255,.74);border:1px solid var(--faint);border-radius:3px;}
.eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--mid);}
.subtle{font-size:11px;color:var(--mid);}
.sectitle{font-size:12px;font-weight:700;letter-spacing:.04em;}

/* header */
.head{display:flex;align-items:flex-end;gap:14px;}
.date{font-weight:800;font-size:42px;line-height:.92;letter-spacing:-.02em;}
.date .wd{font-size:16px;font-weight:700;margin-left:8px;}
.count{font-size:25px;font-weight:700;line-height:1;}
.count small{font-size:13px;color:var(--mid);}
.remain{font-size:11.5px;color:var(--mid);margin-top:3px;}

/* week strip */
.weekwrap{margin-top:12px;}
.weeklbl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mid);margin-bottom:5px;}
.weeklbl .hint{margin-left:auto;}
.week{display:flex;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden;}
.week.slide-l{animation:slideL .22s ease-out;}
.week.slide-r{animation:slideR .22s ease-out;}
@keyframes slideL{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-24px);opacity:.3}to{transform:none;opacity:1}}
.wcell{flex:1;text-align:center;padding:7px 0 8px;border:none;border-left:1px solid var(--faint);
  background:transparent;font:inherit;color:inherit;cursor:pointer;}
.wcell:first-child{border-left:none;}
.wcell[data-sel="1"]{background:rgba(28,42,51,.07);}
.wcell[data-future="1"] .dd{color:var(--mid);}
.wcell[data-today="1"] .dd{text-decoration:underline;text-underline-offset:3px;}
.wcell .wd{font-size:10px;color:var(--mid);}
.wcell .dd{font-size:14px;margin-top:2px;}
.wcell[data-sel="1"] .dd{font-weight:700;}
.bar{height:4px;margin:6px 5px 0;background:rgba(28,42,51,.10);border-radius:2px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--green-line);}

/* task list */
.list{margin-top:14px;border-left:3px double #C96A63;overflow:hidden;}
.cat{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-top:1px solid var(--faint);
  font-size:10.5px;letter-spacing:.2em;color:var(--mid);}
.list > div:first-child > .cat{border-top:none;}
.swatch{width:14px;height:8px;border-radius:1px;}
.item{border-top:1px solid var(--faint);transition:background-color .25s ease;}
.cat + .item{border-top:none;}
.item[data-done="1"]{background:var(--green-bg);}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
  padding:14px 12px;cursor:pointer;font:inherit;color:inherit;}
.box{flex:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;
  display:flex;align-items:center;justify-content:center;}
.box svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2.6;fill:none;display:none;}
.item[data-done="1"] .box{background:var(--green);}
.item[data-done="1"] .box svg{display:block;}
.name{font-size:15.5px;font-weight:600;}
.sub{font-size:11.5px;color:var(--mid);margin-top:3px;}
.stat{margin-left:auto;flex:none;font-size:11px;color:var(--mid);text-align:right;padding-left:8px;}
.subtoggle{display:flex;align-items:center;gap:6px;margin:-4px 12px 12px 46px;padding:5px 9px;border:1px solid var(--faint);
  border-radius:2px;background:rgba(255,255,255,.8);font:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;}
.subs{padding:0 12px 12px 46px;}
.subitem{display:flex;align-items:center;gap:9px;padding:8px 0;border:none;border-top:1px dashed var(--faint);
  background:none;width:100%;font:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer;}
.sbox{flex:none;width:16px;height:16px;border:1.4px solid var(--mid);border-radius:8px;background:#fff;}
.subitem[data-on="1"] .sbox{background:var(--green);border-color:var(--ink);}
.subitem[data-on="1"] span:last-child{color:var(--mid);text-decoration:line-through;}
.offnote{padding:10px 12px;border-top:1px solid var(--faint);}
.empty{padding:18px 12px;font-size:13px;color:var(--mid);}

/* edit */
.editwrap{padding:12px;}
.ecard{border:1px solid rgba(28,42,51,.28);border-radius:3px;background:#fff;margin-bottom:16px;overflow:hidden;}
.ehead{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--ink);color:#F1F4EF;}
.ehead .no{font-size:12px;font-weight:700;letter-spacing:.06em;}
.ehead .nm{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ehead .mv{margin-left:auto;display:flex;gap:4px;}
.ehead .mv button{font:inherit;font-size:12px;width:30px;height:26px;border:1px solid rgba(241,244,239,.45);
  background:transparent;color:#F1F4EF;border-radius:2px;cursor:pointer;padding:0;}
.ehead .mv button[disabled]{opacity:.3;cursor:default;}
.ebody{padding:10px 10px 12px;}
.elabel{font-size:10.5px;letter-spacing:.12em;color:var(--mid);margin:10px 0 5px;}
.elabel:first-child{margin-top:0;}

/* goals */
.goalrow{display:flex;align-items:center;gap:10px;margin-top:10px;}
.gbox{flex:none;width:24px;height:24px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
.gbox svg{width:13px;height:13px;stroke:var(--ink);stroke-width:2.6;fill:none;display:none;}
.gbox[data-on="1"]{background:var(--green);}
.gbox[data-on="1"] svg{display:block;}
.ginput{flex:1;min-width:0;font:inherit;font-size:14.5px;padding:7px 8px;border:1px solid var(--faint);
  border-radius:2px;background:#fff;color:var(--ink);}
.ginput[data-on="1"]{background:var(--green-bg);}
.gdel{flex:none;border:none;background:none;font:inherit;font-size:15px;color:var(--mid);cursor:pointer;padding:4px 6px;}

/* town */
.town{margin-top:14px;padding:14px;}
.townhead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.townname{font-weight:700;font-size:15px;background:none;border:none;padding:0;font-family:inherit;color:var(--ink);cursor:pointer;}
.era{font-size:10.5px;letter-spacing:.14em;color:var(--mid);}
.ptline{margin-left:auto;font-size:11.5px;color:var(--mid);}
.scene{width:100%;display:block;background:rgba(255,255,255,.5);border:1px solid var(--faint);border-radius:2px;}
.nextbar{height:5px;background:rgba(28,42,51,.10);border-radius:3px;overflow:hidden;margin-top:10px;}
.nextbar i{display:block;height:100%;background:var(--green);}
.nexttext{font-size:11px;color:var(--mid);margin-top:6px;}
.newflag{margin-top:9px;font-size:12.5px;padding:8px 10px;border:1px solid var(--ink);border-radius:2px;background:var(--yellow);}

/* controls */
.tools{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap;}
.btn{font:inherit;font-size:12px;padding:8px 12px;border:1px solid var(--faint);background:rgba(255,255,255,.8);
  border-radius:2px;color:var(--ink);cursor:pointer;}
.btn[disabled]{opacity:.4;cursor:default;}
.chip{font:inherit;font-size:11.5px;padding:6px 10px;border:1px solid var(--faint);border-radius:2px;
  background:rgba(255,255,255,.8);cursor:pointer;color:var(--ink);}
.chip[data-on="1"]{background:var(--ink);color:#F1F4EF;border-color:var(--ink);}
.chip[disabled]{opacity:.35;cursor:default;}
.input{font:inherit;font-size:15px;padding:8px;border:1px solid var(--faint);border-radius:2px;
  background:#fff;color:var(--ink);width:100%;}

/* rate */
.ratehead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.rangelbl{font-size:13px;font-weight:700;}
.big{font-size:32px;font-weight:800;line-height:1;}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.hbar{height:6px;background:rgba(28,42,51,.1);border-radius:3px;overflow:hidden;margin-top:5px;}
.hbar i{display:block;height:100%;background:var(--green-line);}
.hrow{margin-top:12px;}
.hrow .t{display:flex;font-size:12.5px;gap:8px;align-items:baseline;}
.hrow .t em{margin-left:auto;color:var(--mid);font-size:11px;font-style:normal;white-space:nowrap;}

/* records */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hcell{aspect-ratio:1;border:1px solid var(--faint);border-radius:2px;background:#fff;font:inherit;
  font-size:9.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--mid);}
.hcell[data-sel="1"]{outline:2px solid var(--ink);outline-offset:1px;}
.yearscroll{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.ygrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);gap:2px;}
.ycell{width:10px;height:10px;border-radius:1.5px;background:rgba(28,42,51,.06);border:none;padding:0;cursor:pointer;}
.ycell[data-sel="1"]{outline:1.5px solid var(--ink);outline-offset:1px;}
.ymonths{display:grid;grid-auto-flow:column;gap:2px;font-size:9px;color:var(--mid);margin-bottom:3px;}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
.statbox{border:1px solid var(--faint);border-radius:2px;padding:9px 10px;background:rgba(255,255,255,.55);}
.statbox b{display:block;font-size:19px;font-weight:700;line-height:1.2;}
.statbox span{font-size:10.5px;color:var(--mid);}

.note{margin-top:14px;font-size:11px;color:var(--mid);line-height:1.7;}
.warn{margin-top:10px;font-size:12px;color:#A5423B;}
.remind{margin-top:10px;font-size:11.5px;padding:8px 10px;border:1px solid var(--faint);border-radius:2px;
  background:rgba(255,255,255,.7);color:var(--mid);}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ .week.slide-l,.week.slide-r{animation:none;} .item{transition:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><div class="eyebrow" id="eyebrow">TODAY</div><div class="date mono" id="date"></div></div>
    <div style="margin-left:auto;text-align:right">
      <div class="count mono" id="count"></div>
      <div class="remain" id="remain"></div>
    </div>
  </div>

  <div class="weekwrap">
    <div class="weeklbl"><span id="weekLabel"></span><span class="hint">左右スワイプ・ホイールで週を移動</span></div>
    <div class="card week" id="week" aria-label="週の選択"></div>
  </div>

  <div class="card list" id="list"></div>

  <div class="tools">
    <button class="btn" id="prev">前の日</button>
    <button class="btn" id="next">次の日</button>
    <button class="btn" id="today">今日へ</button>
    <button class="btn" id="edit" style="margin-left:auto">習慣を編集</button>
  </div>
  <div class="warn" id="warn" hidden></div>

  <div class="card" id="goals" style="margin-top:18px;padding:14px"></div>
  <div class="card town" id="town"></div>
  <div class="card" id="rateCard" style="margin-top:14px;padding:14px"></div>

  <div class="card" style="margin-top:14px;padding:14px">
    <div class="tools" style="margin-top:0">
      <button class="chip" id="tab4w" data-on="1">4週間</button>
      <button class="chip" id="tabyear" data-on="0">年で見る</button>
      <span class="eyebrow" id="rangeLabel" style="margin-left:auto"></span>
    </div>
    <div id="view4w" style="margin-top:12px"></div>
    <div id="viewYear" style="margin-top:12px" hidden></div>
    <div class="statgrid" id="stats"></div>
  </div>

  <div class="tools">
    <button class="btn" id="export">バックアップを保存</button>
    <button class="btn" id="importBtn">バックアップから復元</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <div class="remind" id="remind" hidden></div>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
"use strict";

var KEY="habittown:v3", OLD2="habittown:v2", OLD1="habitlog:v1";
var DONE_PT=3, PERFECT_PT=2, GOAL_PT=100, MAX_GOALS=3;

var DEFAULT_HABITS=[
  { id:"boki",   name:"簿記2級 仕訳", cat:"study", goal:{type:"daily"}, full:"10問",
    subs:[{id:"s1",name:"仕訳"},{id:"s2",name:"工業簿記"},{id:"s3",name:"間違い直し"}] },
  { id:"listen", name:"リスニング",   cat:"study", goal:{type:"daily"}, full:"スクリプト確認＋シャドーイング", subs:[] },
  { id:"speak",  name:"スピーキング", cat:"study", goal:{type:"daily"}, full:"3分話して言い直し", subs:[] }
];
var CATS={ move:{label:"運動",marker:"#A6E86D"}, study:{label:"勉強",marker:"#FBF06B"}, life:{label:"生活",marker:"#8FD9F2"} };
var CAT_ORDER=["move","study","life"];
var WD=["月","火","水","木","金","土","日"];
var CHECK='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6.4 L4.4 9.2 L10.5 2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- 日付 ---------- */
function pad(n){ return n<10?"0"+n:""+n; }
function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseKey(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ return addDays(d,-((d.getDay()+6)%7)); }
function wdOf(d){ return WD[(d.getDay()+6)%7]; }
function monthKey(k){ return k.slice(0,7); }
function maxKey(a,b){ return a>b?a:b; }

/* ---------- 状態 ---------- */
var state={ v:3, habits:DEFAULT_HABITS.slice(), log:{}, goals:{}, timer:null, townName:"", seen:0 };
var todayKey=keyOf(new Date()), selKey=todayKey;
var editing=false, yearView=false, viewYear=new Date().getFullYear();
var rateKind="week", rateAnchor=null;
var storageOK=true, recovered=false, expanded={};

function el(id){ return document.getElementById(id); }

function migrate(p){
  if (!p) return;
  if (p.habits && p.habits.length) state.habits=p.habits;
  if (p.log){
    var log={};
    for (var k in p.log){
      var src=p.log[k], dst={};
      for (var id in src){
        if (id==="_n"){ dst._n=src._n; continue; }
        var v=src[id];
        if (typeof v==="object" && v) dst[id]=v;
        else dst[id]={ l:(v===true?2:+v||0) };
      }
      log[k]=dst;
    }
    state.log=log;
  }
  if (p.goals) state.goals=p.goals;
  if (p.timer) state.timer=p.timer;
  if (p.townName) state.townName=p.townName;
  if (p.seen) state.seen=p.seen;
  if (p.lastExport) state.lastExport=p.lastExport;
}
/* 旧版で計測中だったタイマーは、時間データとして保存してから終了する */
function settleTimer(){
  var t=state.timer;
  if (!t) return;
  state.timer=null;
  var m=Math.min(180,Math.round(Math.max(0,Date.now()-t.start)/60000));
  if (m>0 && t.day && t.id){
    var dd=state.log[t.day]||(state.log[t.day]={});
    var en=dd[t.id]||(dd[t.id]={});
    en.m=(en.m||0)+m;
  }
  save();
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if (raw){ migrate(JSON.parse(raw)); return; }
    var o2=localStorage.getItem(OLD2)||localStorage.getItem(OLD1);
    if (o2){ migrate(JSON.parse(o2)); save(); }
  }catch(e){
    try{
      var bak=localStorage.getItem(KEY+":bak");
      if (bak){ migrate(JSON.parse(bak)); recovered=true; } else storageOK=false;
    }catch(e2){ storageOK=false; }
  }
}
function save(){
  try{
    state.updated=new Date().toISOString();
    var json=JSON.stringify(state), prev=localStorage.getItem(KEY);
    if (prev && prev!==json) localStorage.setItem(KEY+":bak", prev);
    localStorage.setItem(KEY,json);
    storageOK=true;
  }catch(e){ storageOK=false; }
  showWarn();
}
function showWarn(){
  var w=el("warn");
  if (storageOK){ w.hidden=true; return; }
  w.hidden=false;
  w.textContent="この環境では記録を保存できません。URL（またはホーム画面のアイコン）から開いた状態で使ってください。";
}

/* ---------- 予定 ---------- */
function active(){ return state.habits.filter(function(h){ return !h.archived; }); }
function schedDays(h){ var g=h.goal||{}; return (g.days&&g.days.length)?g.days:[0,1,2,3,4,5,6]; }
function weekIdx(k,anchor){
  var m=mondayOf(parseKey(k)), a=mondayOf(parseKey(anchor||k));
  return Math.round((m.getTime()-a.getTime())/604800000);
}
function dueOn(h,k){
  var g=h.goal||{type:"daily"};
  if (g.biweekly && ((weekIdx(k,g.anchor)%2)+2)%2!==0) return false;
  if (g.type==="days") return schedDays(h).indexOf((parseKey(k).getDay()+6)%7)>=0;
  return true;
}
function dueList(k){ return active().filter(function(h){ return dueOn(h,k); }); }
function dueCount(k){ return dueList(k).length; }
function schedText(h){
  var g=h.goal||{type:"daily"}, s;
  if (g.type==="week") s="週"+g.n+"回";
  else if (g.type==="days") s=schedDays(h).map(function(i){ return WD[i]; }).join("");
  else s="毎日";
  return s+(g.biweekly?"・隔週":"");
}
function contentOf(h){ return h.full||h.min||""; }

/* ---------- 記録 ---------- */
function dayIds(day){ return Object.keys(day).filter(function(k){ return k!=="_n"; }); }
function ent(k,id){ var d=state.log[k]; return d && d[id] ? d[id] : null; }
function rawOf(k,id){ var e=ent(k,id); return e && e.l ? e.l : 0; }
function doneOn(k,id){ return rawOf(k,id)>=1; }
function subOn(k,id,sid){ var e=ent(k,id); return !!(e && e.s && e.s[sid]); }

function touch(k,id){
  var day=state.log[k]||(state.log[k]={});
  var e=day[id]||(day[id]={});
  day._n=dueCount(k);
  return e;
}
function cleanup(k,id){
  var day=state.log[k]; if(!day) return;
  var e=day[id];
  if (e && !e.l && !e.m && (!e.s || !Object.keys(e.s).length)) delete day[id];
  if (!dayIds(day).length) delete state.log[k];
}
function setDone(k,id,on){
  var e=touch(k,id);
  if (on) e.l=2; else delete e.l;
  cleanup(k,id); save(); invalidate();
}
function toggleSub(k,id,sid){
  var e=touch(k,id);
  e.s=e.s||{};
  if (e.s[sid]) delete e.s[sid]; else e.s[sid]=1;
  if (!Object.keys(e.s).length) delete e.s;
  cleanup(k,id); save();
}

/* ---------- 集計 ---------- */
function habitById(id){ var h=null; state.habits.forEach(function(x){ if(x.id===id) h=x; }); return h; }
function habitName(id){ var h=habitById(id); return h?h.name:"（記録のみ残る習慣）"; }
function weekCount(anchor,id){
  var mon=mondayOf(anchor), c=0;
  for (var i=0;i<7;i++) if (doneOn(keyOf(addDays(mon,i)),id)) c++;
  return c;
}
function streakCount(id){
  var h=habitById(id), cur=parseKey(todayKey), c=0, guard=0;
  while (guard++<3000){
    var k=keyOf(cur);
    if (h&&!dueOn(h,k)){ cur=addDays(cur,-1); continue; }
    if (doneOn(k,id)){ c++; cur=addDays(cur,-1); continue; }
    if (k===todayKey){ cur=addDays(cur,-1); continue; }
    break;
  }
  return c;
}
function dayDone(k){
  var day=state.log[k]; if(!day) return 0;
  var c=0; dayIds(day).forEach(function(id){ if(doneOn(k,id)) c++; });
  return c;
}
function dayN(k){ var day=state.log[k]; return (day&&day._n)?day._n:dueCount(k); }
function dayRatio(k){ var n=dayN(k); return n?Math.min(1,dayDone(k)/n):0; }
function doneCount(k){ var c=0; dueList(k).forEach(function(h){ if(doneOn(k,h.id)) c++; }); return c; }
/* 旧版の記録（横線=1、＋の上乗せ=3以上）は当時の点数のまま数える */
function ptOfDay(k){
  var day=state.log[k]; if(!day) return 0;
  var ids=dayIds(day), p=0, doneN=0;
  ids.forEach(function(id){
    var r=rawOf(k,id);
    if(!r) return;
    doneN++;
    p += (r===1)?1:DONE_PT+Math.min(r-2,3)*2;
  });
  var n=day._n||ids.length;
  if (n && doneN>=n) p+=PERFECT_PT;
  return p;
}
function goalsOf(mk){ return state.goals[mk]||[]; }
function goalPtTotal(){
  var s=0;
  for (var mk in state.goals) state.goals[mk].forEach(function(g){ if(g.done) s+=GOAL_PT; });
  return s;
}
function goalPtRange(fromK,toK){
  var s=0;
  for (var mk in state.goals) state.goals[mk].forEach(function(g){
    if (g.done && g.doneAt && g.doneAt>=fromK && g.doneAt<=toK) s+=GOAL_PT;
  });
  return s;
}
var ptCache=null;
function invalidate(){ ptCache=null; }
function totalPt(){
  if (ptCache!==null) return ptCache;
  var s=0;
  for (var k in state.log) s+=ptOfDay(k);
  ptCache=s+goalPtTotal();
  return ptCache;
}
function fullDayOn(k){
  var day=state.log[k]; if(!day) return false;
  var n=day._n||dayIds(day).length;
  return n>0 && dayDone(k)>=n;
}
function firstLogKey(){ var ks=Object.keys(state.log).sort(); return ks.length?ks[0]:todayKey; }
function lastLogKey(){ var ks=Object.keys(state.log).sort(); return ks.length?ks[ks.length-1]:todayKey; }
function stats(){
  var keys=Object.keys(state.log).sort();
  var best=0,cur=0,d=parseKey(keys.length?keys[0]:todayKey),end=parseKey(todayKey),doneAll=0;
  while (d<=end){
    var k=keyOf(d);
    if (fullDayOn(k)){ cur++; if(cur>best) best=cur; } else cur=0;
    d=addDays(d,1);
  }
  keys.forEach(function(k){ doneAll+=dayDone(k); });
  var now=0,c=parseKey(todayKey);
  if (!fullDayOn(keyOf(c))) c=addDays(c,-1);
  while (fullDayOn(keyOf(c))&&now<9000){ now++; c=addDays(c,-1); }
  return { days:keys.length, best:best, now:now, total:totalPt(), doneAll:doneAll };
}

/* ---------- 期間集計 ---------- */
function rangeOf(kind,k){
  var d=parseKey(k);
  if (kind==="day") return { from:d, to:d };
  if (kind==="week"){ var m=mondayOf(d); return { from:m, to:addDays(m,6) }; }
  if (kind==="month") return { from:new Date(d.getFullYear(),d.getMonth(),1), to:new Date(d.getFullYear(),d.getMonth()+1,0) };
  return { from:new Date(d.getFullYear(),0,1), to:new Date(d.getFullYear(),11,31) };
}
function shiftAnchor(kind,k,dir){
  var d=parseKey(k);
  if (kind==="day") d=addDays(d,dir);
  else if (kind==="week") d=addDays(d,7*dir);
  else if (kind==="month") d=new Date(d.getFullYear(),d.getMonth()+dir,1);
  else d=new Date(d.getFullYear()+dir,0,1);
  return keyOf(d);
}
function rangeLabelOf(kind,k){
  var d=parseKey(k), r=rangeOf(kind,k);
  if (kind==="day") return (d.getMonth()+1)+"月"+d.getDate()+"日（"+wdOf(d)+"）";
  if (kind==="week") return (r.from.getMonth()+1)+"/"+r.from.getDate()+"〜"+(r.to.getMonth()+1)+"/"+r.to.getDate();
  if (kind==="month") return d.getFullYear()+"年"+(d.getMonth()+1)+"月";
  return d.getFullYear()+"年";
}
/* 期間の終わり：今日まで。ただし未来日に記録があればその日まで含める */
function rangeEnd(tk,fk){
  if (tk<=todayKey) return tk;
  var last=todayKey;
  Object.keys(state.log).forEach(function(k){ if(k>last && k>=fk && k<=tk) last=k; });
  return last;
}
function summarize(kind,k){
  var r=rangeOf(kind,k), fk=keyOf(r.from), tk=keyOf(r.to), first=firstLogKey();
  var startK=fk<first?first:fk, endK=rangeEnd(tk,fk);
  var res={ empty:true, clipped:(fk<first), days:0, slots:0, done:0, perfect:0, pt:0,
            per:{}, ids:[], from:startK, to:endK, goalsDone:0, future:endK>todayKey };
  if (startK>endK) return res;
  res.empty=false;
  var seen={};
  active().forEach(function(h){ seen[h.id]=true; });
  var d=parseKey(startK), end=parseKey(endK);
  while (d<=end){
    var kk=keyOf(d), day=state.log[kk], n=dayN(kk), dn=0;
    res.days++; res.slots+=n;
    if (day){
      dayIds(day).forEach(function(id){
        if (!doneOn(kk,id)) return;
        seen[id]=true;
        var p=res.per[id]||(res.per[id]={done:0});
        dn++; res.done++; p.done++;
      });
      res.pt+=ptOfDay(kk);
    }
    if (n&&dn>=n) res.perfect++;
    d=addDays(d,1);
  }
  res.pt+=goalPtRange(startK,endK);
  res.goalsDone=goalPtRange(startK,endK)/GOAL_PT;
  res.ids=Object.keys(seen);
  return res;
}
function targetIn(id,startK,endK){
  var h=habitById(id);
  var d=parseKey(startK), end=parseKey(endK);
  if (!h){
    var n=0;
    while (d<=end){ n++; d=addDays(d,1); }
    return Math.max(1,n);
  }
  var g=h.goal||{type:"daily"}, due=0, byWeek={};
  while (d<=end){
    var k=keyOf(d);
    if (dueOn(h,k)){ due++; var w=keyOf(mondayOf(d)); byWeek[w]=(byWeek[w]||0)+1; }
    d=addDays(d,1);
  }
  if (g.type==="week"){
    var t=0;
    for (var w2 in byWeek) t+=(g.n||1)*byWeek[w2]/7;
    return Math.max(1,t);
  }
  return Math.max(1,due);
}
function pct(a,b){ return b>0?Math.round(a/b*100):0; }

function fillerSlots(){
  var out=[], seed=20260820;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
  [{y:120,s:.5},{y:142,s:.58},{y:172,s:.68},{y:200,s:.75}].forEach(function(b){
    for (var x=16;x<348;x+=16)
      out.push({ x:x+Math.round(rnd()*7-3), y:b.y+Math.round(rnd()*4-2), s:b.s, t:(rnd()>.62?"tree":"cot") });
  });
  out=out.filter(function(p){
    return !LAND.some(function(l){ return Math.abs(l.x-p.x)<20&&Math.abs(l.y-p.y)<26; });
  });
  for (var i=out.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)),t=out[i]; out[i]=out[j]; out[j]=t; }
  return out;
}

/* スワイプ・ホイールで1週ずつ移動 */
var swipeMoved=false;
(function(){
  var box=el("week"), sx=0, sy=0, tracking=false;
  box.addEventListener("touchstart",function(e){
    if (e.touches.length!==1) return;
    tracking=true; swipeMoved=false;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  box.addEventListener("touchend",function(e){
    if (!tracking) return;
    tracking=false;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if (Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.3){
      swipeMoved=true;
      setTimeout(function(){ swipeMoved=false; },350);
      shiftWeek(dx<0?1:-1);
    }
  },{passive:true});
  var acc=0, lock=0;
  box.addEventListener("wheel",function(e){
    e.preventDefault();
    var now=Date.now();
    if (now<lock) return;
    var dv=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if (e.deltaMode===1) dv*=30;
    acc+=dv;
    if (Math.abs(acc)>=50){
      var dir=acc>0?1:-1;
      acc=0; lock=now+380;
      shiftWeek(dir);
    }
  },{passive:false});
})();

function statText(h){
  var g=h.goal||{type:"daily"};
  if (g.type==="week") return weekCount(parseKey(selKey),h.id)+"/"+g.n+" 週";
  if (g.type==="days"||g.biweekly){
    var mon=mondayOf(parseKey(selKey)), c=0, t=0;
    for (var i=0;i<7;i++){
      var k=keyOf(addDays(mon,i));
      if (dueOn(h,k)){ t++; if (doneOn(k,h.id)) c++; }
    }
    if (!t) return "今週は対象外";
    return c+"/"+t+" 週";
  }
  var s=streakCount(h.id);
  return s>0?s+"日連続":"毎日";
}
function renderList(){
  var box=el("list"); box.innerHTML="";
  if (editing){ renderEdit(box); return; }
  var shown=0;

  CAT_ORDER.forEach(function(cat){
    var items=active().filter(function(h){
      return h.cat===cat && (dueOn(h,selKey)||doneOn(selKey,h.id));
    });
    if (!items.length) return;
    var grp=document.createElement("div");
    var head=document.createElement("div");
    head.className="cat";
    head.innerHTML='<span class="swatch" style="background:'+CATS[cat].marker+'"></span>'+CATS[cat].label;
    grp.appendChild(head);

    items.forEach(function(h){
      shown++;
      var done=doneOn(selKey,h.id);
      var item=document.createElement("div");
      item.className="item";
      item.setAttribute("data-done",done?"1":"0");

      var b=document.createElement("button");
      b.className="row";
      b.setAttribute("aria-pressed",done?"true":"false");
      b.innerHTML='<span class="box">'+CHECK+'</span><span style="min-width:0"><div class="name"></div><div class="sub"></div></span><span class="stat mono"></span>';
      b.querySelector(".name").textContent=h.name;
      var sub=schedText(h)+(contentOf(h)?"　"+contentOf(h):"")+(dueOn(h,selKey)?"":"　※この日は対象外");
      b.querySelector(".sub").textContent=sub;
      b.querySelector(".stat").textContent=statText(h);
      b.onclick=function(){
        setDone(selKey,h.id,!doneOn(selKey,h.id));
        renderList(); refresh();
      };
      item.appendChild(b);

      if (h.subs&&h.subs.length){
        var cnt=h.subs.filter(function(s){ return subOn(selKey,h.id,s.id); }).length;
        var tg=document.createElement("button");
        tg.className="subtoggle";
        tg.textContent="小項目 "+cnt+"/"+h.subs.length+(expanded[h.id]?"　▲":"　▼");
        tg.onclick=function(){ expanded[h.id]=!expanded[h.id]; renderList(); };
        item.appendChild(tg);
        if (expanded[h.id]){
          var sc=document.createElement("div");
          sc.className="subs";
          h.subs.forEach(function(s){
            var on=subOn(selKey,h.id,s.id);
            var sb=document.createElement("button");
            sb.className="subitem";
            sb.setAttribute("data-on",on?"1":"0");
            sb.innerHTML='<span class="sbox"></span><span></span>';
            sb.querySelector("span:last-child").textContent=s.name;
            sb.onclick=function(){ toggleSub(selKey,h.id,s.id); renderList(); };
            sc.appendChild(sb);
          });
          var hint=document.createElement("div");
          hint.className="subtle"; hint.style.marginTop="8px";
          hint.textContent="小項目は達成率とptには影響しません。";
          sc.appendChild(hint);
          item.appendChild(sc);
        }
      }
      grp.appendChild(item);
    });
    box.appendChild(grp);
  });

  var off=active().filter(function(h){ return !dueOn(h,selKey)&&!doneOn(selKey,h.id); });
  if (!shown){
    var em=document.createElement("div");
    em.className="empty";
    em.textContent=active().length?"この日に予定している習慣はありません。":"「習慣を編集」から習慣を追加してください。";
    box.appendChild(em);
  }
  if (off.length){
    var note=document.createElement("div");
    note.className="subtle offnote";
    note.textContent="この日が対象外："+off.map(function(h){ return h.name+"（"+schedText(h)+"）"; }).join("、");
    box.appendChild(note);
  }
}
function refresh(){
  renderHead(); renderWeek(); renderGoals(); renderRate(); renderRecords(); renderTown();
}

/* ---------- 編集 ---------- */
function renderEdit(box){
  var wrap=document.createElement("div");
  wrap.className="editwrap";
  var list=active();
  list.forEach(function(h,i){ wrap.appendChild(editCard(h,i,list.length)); });

  var add=document.createElement("button");
  add.className="btn"; add.textContent="習慣を追加";
  add.onclick=function(){
    state.habits.push({ id:"h"+Date.now(), name:"新しい習慣", full:"", cat:"study", goal:{type:"daily"}, subs:[] });
    save(); renderList(); refresh();
  };
  wrap.appendChild(add);

  var arch=state.habits.filter(function(h){ return h.archived; });
  if (arch.length){
    var t=document.createElement("div");
    t.className="eyebrow"; t.style.margin="20px 0 8px";
    t.textContent="終了した習慣（記録は残ります）";
    wrap.appendChild(t);
    arch.forEach(function(h){
      var line=document.createElement("div");
      line.className="tools"; line.style.marginTop="6px";
      var nm=document.createElement("span"); nm.style.fontSize="13px"; nm.textContent=h.name;
      var back=document.createElement("button"); back.className="chip"; back.textContent="再開";
      back.onclick=function(){ delete h.archived; save(); renderList(); refresh(); };
      line.appendChild(nm); line.appendChild(back);
      wrap.appendChild(line);
    });
  }
  box.appendChild(wrap);
}
function moveHabit(h,dir){
  var list=active(), i=list.indexOf(h), j=i+dir;
  if (j<0||j>=list.length) return;
  var a=state.habits.indexOf(list[i]), b=state.habits.indexOf(list[j]);
  var tmp=state.habits[a]; state.habits[a]=state.habits[b]; state.habits[b]=tmp;
  save(); renderList(); refresh();
}
function editCard(h,idx,len){
  var card=document.createElement("div");
  card.className="ecard";

  var head=document.createElement("div");
  head.className="ehead";
  head.innerHTML='<span class="no mono">'+pad(idx+1)+'</span><span class="nm"></span><span class="mv"></span>';
  var nmSpan=head.querySelector(".nm");
  nmSpan.textContent=h.name||"（名前なし）";
  var up=document.createElement("button"); up.textContent="↑"; up.setAttribute("aria-label","上へ移動"); up.disabled=idx===0;
  var dn=document.createElement("button"); dn.textContent="↓"; dn.setAttribute("aria-label","下へ移動"); dn.disabled=idx===len-1;
  up.onclick=function(){ moveHabit(h,-1); };
  dn.onclick=function(){ moveHabit(h,1); };
  head.querySelector(".mv").appendChild(up); head.querySelector(".mv").appendChild(dn);
  card.appendChild(head);

  var body=document.createElement("div");
  body.className="ebody";
  function label(t){ var l=document.createElement("div"); l.className="elabel"; l.textContent=t; body.appendChild(l); }
  function field(val,ph,onInput){
    var i=document.createElement("input");
    i.className="input"; i.value=val||""; i.placeholder=ph; i.setAttribute("aria-label",ph);
    i.oninput=function(){ onInput(i.value); save(); };
    body.appendChild(i);
    return i;
  }

  label("名前");
  field(h.name,"習慣の名前",function(v){ h.name=v; nmSpan.textContent=v||"（名前なし）"; });
  label("内容");
  field(contentOf(h),"やること（例：10問、3分話す）",function(v){ h.full=v; delete h.min; });
  label("小項目（カンマ区切り）");
  field((h.subs||[]).map(function(s){ return s.name; }).join(", "),"例：スクワット, 腕立て, 懸垂",function(v){
    var names=v.split(/[,、，]/).map(function(s){ return s.trim(); }).filter(Boolean);
    var old=h.subs||[];
    h.subs=names.map(function(n,i){
      var prev=old.filter(function(o){ return o.name===n; })[0];
      return { id:prev?prev.id:("s"+i+"_"+Date.now()), name:n };
    });
  });

  label("種類");
  var cline=document.createElement("div"); cline.className="tools"; cline.style.marginTop="0";
  CAT_ORDER.forEach(function(c){
    var cb=document.createElement("button");
    cb.className="chip"; cb.textContent=CATS[c].label;
    cb.setAttribute("data-on",h.cat===c?"1":"0");
    cb.onclick=function(){ h.cat=c; save(); renderList(); };
    cline.appendChild(cb);
  });
  body.appendChild(cline);

  label("頻度");
  var sline=document.createElement("div"); sline.className="tools"; sline.style.marginTop="0";
  function setType(t){
    var bw=h.goal.biweekly, an=h.goal.anchor;
    if (t==="daily") h.goal={type:"daily"};
    else if (t==="week") h.goal={type:"week",n:h.goal.n||3};
    else h.goal={type:"days",days:(h.goal.days&&h.goal.days.length)?h.goal.days:[0,2,4]};
    if (bw){ h.goal.biweekly=true; h.goal.anchor=an; }
    save(); renderList();
  }
  [["daily","毎日"],["week","週何回"],["days","曜日"]].forEach(function(x){
    var b=document.createElement("button");
    b.className="chip"; b.textContent=x[1];
    b.setAttribute("data-on",h.goal.type===x[0]?"1":"0");
    b.onclick=function(){ setType(x[0]); };
    sline.appendChild(b);
  });
  if (h.goal.type==="week"){
    var sel=document.createElement("select");
    sel.className="chip mono"; sel.setAttribute("aria-label","週の回数");
    [1,2,3,4,5,6,7].forEach(function(n){
      var o=document.createElement("option"); o.value=n; o.textContent=n+"回";
      if (h.goal.n===n) o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=function(){ h.goal.n=+sel.value; save(); };
    sline.appendChild(sel);
  }
  var bw=document.createElement("button");
  bw.className="chip"; bw.textContent="隔週";
  bw.setAttribute("data-on",h.goal.biweekly?"1":"0");
  bw.onclick=function(){
    if (h.goal.biweekly){ delete h.goal.biweekly; delete h.goal.anchor; }
    else { h.goal.biweekly=true; h.goal.anchor=keyOf(mondayOf(parseKey(selKey))); }
    save(); renderList();
  };
  sline.appendChild(bw);
  body.appendChild(sline);

  if (h.goal.type==="days"){
    var dline=document.createElement("div"); dline.className="tools"; dline.style.marginTop="8px";
    WD.forEach(function(w,i){
      var b=document.createElement("button");
      b.className="chip"; b.textContent=w;
      b.setAttribute("data-on",schedDays(h).indexOf(i)>=0?"1":"0");
      b.onclick=function(){
        var ds=schedDays(h).slice(), at=ds.indexOf(i);
        if (at>=0) ds.splice(at,1); else ds.push(i);
        ds.sort(function(a,b2){ return a-b2; });
        h.goal.days=ds.length?ds:[i];
        save(); renderList();
      };
      dline.appendChild(b);
    });
    body.appendChild(dline);
  }
  if (h.goal.biweekly){
    var an=document.createElement("div");
    an.className="subtle"; an.style.marginTop="6px";
    an.textContent="隔週の基準は "+h.goal.anchor+" の週です（この週と1週おきが対象）。";
    body.appendChild(an);
  }

  var fline=document.createElement("div"); fline.className="tools";
  var fin=document.createElement("button");
  fin.className="chip"; fin.textContent="終了にする"; fin.style.marginLeft="auto";
  fin.onclick=function(){ h.archived=true; save(); renderList(); refresh(); };
  fline.appendChild(fin);
  body.appendChild(fline);

  card.appendChild(body);
  return card;
}

/* ---------- 月の大目標 ---------- */
function renderGoals(){
  var box=el("goals"), mk=monthKey(selKey), list=goalsOf(mk);
  var d=parseKey(selKey);
  var doneN=list.filter(function(g){ return g.done; }).length;
  box.innerHTML='<div class="tools" style="margin-top:0"><span class="sectitle">'+d.getFullYear()+"年"+(d.getMonth()+1)+
    '月の大目標</span><span class="subtle" style="margin-left:auto">'+doneN+"/"+list.length+
    '（1つ達成で '+GOAL_PT+'pt）</span></div>';

  list.forEach(function(g){
    var row=document.createElement("div");
    row.className="goalrow";
    var cb=document.createElement("button");
    cb.className="gbox"; cb.setAttribute("data-on",g.done?"1":"0");
    cb.setAttribute("aria-label",(g.name||"大目標")+(g.done?"：達成済み":"：未達成"));
    cb.innerHTML=CHECK;
    cb.onclick=function(){
      g.done=!g.done;
      if (g.done) g.doneAt=todayKey; else delete g.doneAt;
      save(); invalidate(); renderGoals(); renderTown(); renderRate(); renderRecords();
    };
    var inp=document.createElement("input");
    inp.className="ginput"; inp.value=g.name||""; inp.placeholder="今月の大きな目標";
    inp.setAttribute("data-on",g.done?"1":"0");
    inp.setAttribute("aria-label","大目標の内容");
    inp.oninput=function(){ g.name=inp.value; save(); };
    var del=document.createElement("button");
    del.className="gdel"; del.textContent="×"; del.setAttribute("aria-label","この目標を削除");
    del.onclick=function(){
      if (!confirm("この大目標を削除します。よろしいですか。")) return;
      state.goals[mk]=list.filter(function(x){ return x!==g; });
      save(); invalidate(); renderGoals(); renderTown(); renderRate(); renderRecords();
    };
    row.appendChild(cb); row.appendChild(inp); row.appendChild(del);
    box.appendChild(row);
  });

  if (list.length<MAX_GOALS){
    var add=document.createElement("button");
    add.className="btn"; add.style.marginTop="12px";
    add.textContent="大目標を追加（あと"+(MAX_GOALS-list.length)+"つ）";
    add.onclick=function(){
      state.goals[mk]=list.concat([{ id:"g"+Date.now(), name:"", done:false }]);
      save(); renderGoals();
    };
    box.appendChild(add);
  } else {
    var n=document.createElement("div");
    n.className="subtle"; n.style.marginTop="10px";
    n.textContent="1か月に決められる大目標は3つまでです。";
    box.appendChild(n);
  }
}

/* ---------- 達成率 ---------- */
function renderRate(){
  var box=el("rateCard");
  if (!rateAnchor) rateAnchor=selKey;
  var s=summarize(rateKind,rateAnchor);
  var tabs=[["day","当日"],["week","週"],["month","月"],["year","年"]].map(function(x){
    return '<button class="chip" data-kind="'+x[0]+'" data-on="'+(rateKind===x[0]?"1":"0")+'">'+x[1]+'</button>';
  }).join("");
  var body;
  if (s.empty){
    body='<div class="subtle" style="margin-top:12px">この期間にはまだ記録がありません。</div>';
  } else {
    var rate=pct(s.done,s.slots), prate=pct(s.perfect,s.days);
    var rows=s.ids.map(function(id){
      var p=s.per[id]||{done:0};
      var tg=targetIn(id,s.from,s.to), h=habitById(id);
      var wk=(h&&h.goal&&h.goal.type==="week");
      var tgd=wk?Math.max(1,Math.round(tg)):tg;
      return '<div class="hrow"><div class="t"><span></span>'+(h?'<span class="subtle">（'+schedText(h)+'）</span>':'')+
        '<em class="mono">'+pct(p.done,tg)+'%・'+p.done+'/'+tgd+(wk?"回":"日")+'</em></div>'+
        '<div class="hbar"><i style="width:'+Math.min(100,pct(p.done,tg))+'%"></i></div></div>';
    }).join("");
    body='<div style="display:flex;align-items:flex-end;gap:12px;margin-top:12px">'+
      '<div><div class="big mono">'+rate+'<span style="font-size:15px">%</span></div>'+
      '<div class="subtle" style="margin-top:4px">達成 '+s.done+'/'+s.slots+' 項目</div></div>'+
      '<div style="margin-left:auto;text-align:right" class="subtle">獲得 <span class="mono">'+s.pt+'</span>pt'+
      (s.goalsDone?'<br>大目標 '+s.goalsDone+'件':'')+'</div></div>'+
      '<div class="metrics">'+
      '<div><div class="subtle">全項目達成の日</div><div class="mono" style="font-size:17px;font-weight:700">'+s.perfect+'/'+s.days+'</div></div>'+
      '<div><div class="subtle">完全達成率</div><div class="mono" style="font-size:17px;font-weight:700">'+prate+'%</div></div>'+
      '<div><div class="subtle">対象日数</div><div class="mono" style="font-size:17px;font-weight:700">'+s.days+'日</div></div>'+
      '</div>'+rows+
      (s.clipped?'<div class="subtle" style="margin-top:10px">記録開始日（'+s.from+'）以降で計算しています。</div>':'')+
      (rateKind!=="day"&&s.to===todayKey&&keyOf(rangeOf(rateKind,rateAnchor).to)>todayKey?'<div class="subtle" style="margin-top:6px">期間の途中のため、今日までの'+s.days+'日で計算しています。</div>':'')+
      (s.future?'<div class="subtle" style="margin-top:6px">先の日付に入れた記録（'+s.to+'まで）も含めています。</div>':'');
  }
  box.innerHTML='<div class="ratehead">'+tabs+
    '<span style="margin-left:auto;display:flex;gap:6px;align-items:center">'+
    '<button class="chip" id="rPrev" aria-label="前の期間">◀</button><span class="rangelbl">'+rangeLabelOf(rateKind,rateAnchor)+
    '</span><button class="chip" id="rNext" aria-label="次の期間">▶</button></span></div>'+body;
  var names=box.querySelectorAll(".hrow .t > span:first-child");
  s.ids && !s.empty && s.ids.forEach(function(id,i){ if (names[i]) names[i].textContent=habitName(id); });
  Array.prototype.forEach.call(box.querySelectorAll("[data-kind]"),function(b){
    b.onclick=function(){ rateKind=b.getAttribute("data-kind"); renderRate(); };
  });
  el("rPrev").onclick=function(){ rateAnchor=shiftAnchor(rateKind,rateAnchor,-1); renderRate(); };
  var nx=el("rNext");
  nx.disabled=keyOf(rangeOf(rateKind,shiftAnchor(rateKind,rateAnchor,1)).from)>maxKey(todayKey,lastLogKey());
  nx.onclick=function(){ rateAnchor=shiftAnchor(rateKind,rateAnchor,1); renderRate(); };
}

/* ---------- 記録ビュー ---------- */
function heatColor(r){ return "rgba(96,168,52,"+(0.08+r*0.8).toFixed(3)+")"; }
function render4w(){
  var box=el("view4w"); box.innerHTML="";
  var grid=document.createElement("div");
  grid.className="heat";
  var start=addDays(mondayOf(parseKey(todayKey)),-21);
  for (var i=0;i<28;i++){
    (function(d){
      var k=keyOf(d), r=dayRatio(k);
      var b=document.createElement("button");
      b.className="hcell mono";
      b.setAttribute("data-sel",k===selKey?"1":"0");
      b.textContent=d.getDate();
      if (k>todayKey && !state.log[k]) b.style.opacity=".45";
      else b.style.background=r>0?heatColor(r):"#fff";
      if (r>0.6) b.style.color="#1C2A33";
      b.onclick=function(){ selKey=k; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
      grid.appendChild(b);
    })(addDays(start,i));
  }
  box.appendChild(grid);
  el("rangeLabel").textContent="左から月曜";
}
function renderYear(){
  var box=el("viewYear"); box.innerHTML="";
  var nav=document.createElement("div");
  nav.className="tools"; nav.style.marginTop="0";
  var back=document.createElement("button"); back.className="chip"; back.textContent="◀";
  var fwd=document.createElement("button"); fwd.className="chip"; fwd.textContent="▶";
  var lbl=document.createElement("span"); lbl.className="mono"; lbl.style.fontSize="13px";
  lbl.textContent=viewYear+" 年";
  fwd.disabled=viewYear>=parseKey(maxKey(todayKey,lastLogKey())).getFullYear();
  back.onclick=function(){ viewYear--; renderYear(); };
  fwd.onclick=function(){ viewYear++; renderYear(); };
  nav.appendChild(back); nav.appendChild(lbl); nav.appendChild(fwd);
  box.appendChild(nav);

  var scroll=document.createElement("div"); scroll.className="yearscroll";
  var months=document.createElement("div"); months.className="ymonths";
  var grid=document.createElement("div"); grid.className="ygrid";
  var d=mondayOf(new Date(viewYear,0,1)), end=new Date(viewYear,11,31), monthCells=[];
  while (d<=end||(d.getDay()+6)%7!==0){
    if ((d.getDay()+6)%7===0) monthCells.push(d.getMonth());
    (function(dd){
      var k=keyOf(dd), inYear=dd.getFullYear()===viewYear;
      var c=document.createElement("button");
      c.className="ycell";
      c.title=(dd.getMonth()+1)+"/"+dd.getDate();
      c.setAttribute("data-sel",k===selKey?"1":"0");
      if (!inYear){ c.style.visibility="hidden"; c.disabled=true; }
      else {
        var r=dayRatio(k);
        c.style.background=r>0?heatColor(r):(k>todayKey?"rgba(28,42,51,.03)":"rgba(28,42,51,.06)");
        c.onclick=function(){
          selKey=k; rateAnchor=k;
          renderHead(); renderWeek(); renderList(); renderGoals(); renderRate(); renderYear(); renderStats(); renderTown();
        };
      }
      grid.appendChild(c);
    })(new Date(d.getTime()));
    d=addDays(d,1);
    if (d.getFullYear()>viewYear&&(d.getDay()+6)%7===0) break;
  }
  var lastM=-1;
  monthCells.forEach(function(m){
    var s=document.createElement("span");
    s.style.width="12px";
    s.textContent=(m!==lastM)?(m+1):"";
    lastM=m;
    months.appendChild(s);
  });
  scroll.appendChild(months); scroll.appendChild(grid); box.appendChild(scroll);
  if (viewYear===new Date().getFullYear()) setTimeout(function(){ scroll.scrollLeft=Math.max(0,scroll.scrollWidth*((new Date().getMonth()+1)/12)-scroll.clientWidth); },0);
  el("rangeLabel").textContent="濃いほど達成率が高い";
}

/* ---------- 全体 ---------- */
function renderAll(slide){
  rateAnchor=selKey;
  renderHead(); renderWeek(slide); renderList(); renderGoals(); renderTown();
  renderRate(); renderRecords(); renderRemind(); showWarn();
}
function renderRemind(){
  var r=el("remind"), keys=Object.keys(state.log);
  if (!keys.length){ r.hidden=true; return; }
  var msg="";
  if (recovered) msg="保存データが読み取れなかったため、直前の予備データから復元しました。念のためバックアップを保存してください。";
  else {
    var last=state.lastExport?new Date(state.lastExport):null;
    var span=last?(Date.now()-last.getTime())/86400000:0;
    if (!last&&keys.length>=14) msg="記録が2週間分を超えました。バックアップを一度保存しておくと安全です。";
    else if (last&&span>=30) msg="前回のバックアップから"+Math.floor(span)+"日経過しました。";
  }
  r.hidden=!msg; r.textContent=msg;
}

el("prev").onclick=function(){ selKey=keyOf(addDays(parseKey(selKey),-1)); renderAll(); };
el("next").onclick=function(){ selKey=keyOf(addDays(parseKey(selKey),1)); renderAll(); };
el("today").onclick=function(){ selKey=todayKey; renderAll(); };
el("edit").onclick=function(){
  editing=!editing;
  el("edit").textContent=editing?"編集を終わる":"習慣を編集";
  renderList();
  if (!editing) refresh();
};
el("tab4w").onclick=function(){
  yearView=false;
  el("tab4w").setAttribute("data-on","1"); el("tabyear").setAttribute("data-on","0");
  el("view4w").hidden=false; el("viewYear").hidden=true;
  renderRecords();
};
el("tabyear").onclick=function(){
  yearView=true; viewYear=parseKey(selKey).getFullYear();
  el("tab4w").setAttribute("data-on","0"); el("tabyear").setAttribute("data-on","1");
  el("view4w").hidden=true; el("viewYear").hidden=false;
  renderRecords();
};
el("export").onclick=function(){
  var blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="habit-town-"+todayKey+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  state.lastExport=new Date().toISOString(); recovered=false;
  save(); renderRemind();
};
el("importBtn").onclick=function(){ el("importFile").click(); };
el("importFile").onchange=function(e){
  var f=e.target.files&&e.target.files[0];
  if (!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if (!p||!Array.isArray(p.habits)||!p.log) throw new Error("形式が違います");
      if (!confirm("今の記録を、このバックアップで置き換えます。よろしいですか。")) return;
      state={ v:3, habits:[], log:{}, goals:{}, timer:null, townName:"", seen:0 };
      migrate(p); settleTimer();
      invalidate(); save(); renderAll();
    }catch(err){ alert("復元できませんでした。書き出したJSONファイルを選んでください。"); }
  };
  r.readAsText(f);
  e.target.value="";
};

function checkDay(){
  var k=keyOf(new Date());
  if (k!==todayKey){
    var wasToday=(selKey===todayKey);
    todayKey=k;
    if (wasToday) selKey=k;
    renderAll();
  }
}
setInterval(checkDay,30000);
document.addEventListener("visibilitychange",function(){ if (!document.hidden) checkDay(); });

el("note").textContent="習慣をタップすると達成（緑）、もう一度タップで取り消し。達成1つで"+DONE_PT+"pt、その日の予定を全部達成すると+"+PERFECT_PT+
  "pt、月の大目標は1つ達成で"+GOAL_PT+"pt。先の日付にも記録できるので、多めにやった分は翌日以降の欄に付けてください。"+
  "小項目は進捗の目印で、達成率とptには影響しません。記録は端末内に保存されます。月に一度はバックアップの保存をおすすめします。";

load();
settleTimer();
invalidate();
renderAll();
if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
})();
</script>
</body>
</html>
